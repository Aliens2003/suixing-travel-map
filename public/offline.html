<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随行 · 离线查看</title><style>body{margin:0;background:#fafbf7;color:#304f3c;font:15px/1.9 -apple-system,sans-serif;padding:28px 22px}main{max-width:600px;margin:auto}h1{font-size:27px}h2{font-size:21px;margin-top:30px}h3{font-size:17px}article{border:1px solid #e0e7d9;border-radius:14px;padding:17px;margin:12px 0;background:white}p{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#87967d}a{color:#32745f}button{background:#32745f;color:white;border:0;border-radius:10px;padding:12px 20px}</style><main><small>SUIXING / OFFLINE</small><h1>把旅途，留在身边。</h1><p>当前为离线文字查看。只显示这台设备最近成功同步的内容；编辑、地图和路线查询需要联网。</p><a href="/">返回地图 / 联网后重试 →</a><div id="content"></div></main><script>const root=document.getElementById('content');function el(tag,text,parent=root){const e=document.createElement(tag);e.textContent=text;parent.appendChild(e);return e}try{const k=localStorage.getItem('suixing-last-cache'),cached=JSON.parse(localStorage.getItem(k)||'null'),d=cached?.data;if(!d)el('p','这台设备还没有保存的数据，请联网登录并同步一次。');else if(d.schemaVersion!==2)el('p','旧实验缓存已停用，请联网同步新版收藏夹。');else{for(const f of d.folders){el('h2',f.name);for(const r of f.routes){const a=el('article','');el('h3',r.name+(r.date?' · '+r.date:''),a);r.stops.forEach((id,i)=>{const p=d.places.find(p=>p.id===id);if(p)el('p',(i+1)+'. '+p.name+(p.note?'\n'+p.note:''),a)});if(r.note)el('p',r.note,a)}for(const id of f.placeIds){const p=d.places.find(p=>p.id===id);if(p){const a=el('article','');el('h3',p.name,a);el('small',d.categories.find(c=>c.id===p.category)?.name||'',a);el('p',[p.tags,p.note,p.url].filter(Boolean).join('\n'),a)}}}}}catch{el('p','未能读取本机缓存，请联网重试。')}</script></html>
